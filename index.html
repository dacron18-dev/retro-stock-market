<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Stock Market - Floor Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        .retro-font { font-family: 'VT323', monospace; }
    </style>
</head>
<body class="bg-gray-900 text-green-400 min-h-screen p-4 retro-font">

    <!-- Header -->
    <header class="border-b-2 border-green-500 pb-4 mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-4xl font-bold tracking-wider">📼 RETRO BOURSE '88</h1>
            <p class="text-xs text-green-600">LIVE FLOOR BROKER EXECUTION TERMINAL</p>
        </div>
        <div class="text-right">
            <span id="market-status" class="bg-green-500 text-black px-3 py-1 font-bold text-lg rounded">MARKET OPEN</span>
        </div>
    </header>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Column 1: Broker Order Entry -->
        <div class="bg-gray-800 p-4 border border-green-500 rounded">
            <h2 class="text-2xl font-bold mb-4 border-b border-green-700 pb-2">📋 PLACE ORDER (IN-CHARGE)</h2>
            <form id="order-form" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1">PARTICIPANT ID</label>
                    <input type="text" id="trader-id" placeholder="e.g. TRADER-101" required class="w-full bg-black border border-green-500 p-2 text-green-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm mb-1">SELECT STOCK</label>
                    <select id="stock-select" class="w-full bg-black border border-green-500 p-2 text-green-400 focus:outline-none">
                        <!-- Options generated dynamically -->
                    </select>
                </div>
                <div>
                    <label class="block text-sm mb-1">ACTION</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" id="btn-buy" onclick="setAction('BUY')" class="bg-green-600 text-black font-bold p-2 text-center border-2 border-green-400">BUY</button>
                        <button type="button" id="btn-sell" onclick="setAction('SELL')" class="bg-gray-700 text-green-400 font-bold p-2 text-center border-2 border-gray-600">SELL</button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm mb-1">QUANTITY</label>
                    <input type="number" id="trade-qty" min="1" value="10" required class="w-full bg-black border border-green-500 p-2 text-green-400 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-green-500 hover:bg-green-400 text-black font-bold py-3 text-xl transition">EXECUTE TRADE</button>
            </form>
        </div>

        <!-- Column 2: Live Stock Prices -->
        <div class="bg-gray-800 p-4 border border-green-500 rounded">
            <h2 class="text-2xl font-bold mb-4 border-b border-green-700 pb-2">📈 LIVE TICKER BOARD</h2>
            <div id="stocks-container" class="space-y-3">
                <!-- Stocks populated here -->
            </div>
        </div>

        <!-- Column 3: Event Control & Recent Ledger -->
        <div class="space-y-6">
            <!-- Market Shocks -->
            <div class="bg-gray-800 p-4 border border-red-500 rounded">
                <h2 class="text-2xl font-bold text-red-500 mb-2">⚡ TRIGGER BREAKING NEWS</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="triggerShock('DEL', -0.25)" class="bg-red-900 border border-red-500 p-2 text-xs hover:bg-red-800">DeLorean Recall (-25%)</button>
                    <button onclick="triggerShock('BLK', 0.30)" class="bg-green-900 border border-green-500 p-2 text-xs hover:bg-green-800">Blockbuster Boom (+30%)</button>
                </div>
            </div>

            <!-- Recent Trades -->
            <div class="bg-gray-800 p-4 border border-green-500 rounded">
                <h2 class="text-xl font-bold mb-2">📜 RECENT LEDGER</h2>
                <div id="ledger" class="space-y-1 text-xs h-48 overflow-y-auto font-mono">
                    <p class="text-gray-500">No transactions recorded yet.</p>
                </div>
            </div>
        </div>

    </div>

    <!-- JS Logic -->
    <script>
        let currentAction = 'BUY';
        
        // Initial Stock State
        let stocks = [
            { symbol: 'BLK', name: 'Blockbuster Video', price: 50.00, buys: 0, sells: 0 },
            { symbol: 'DEL', name: 'DeLorean Motors', price: 120.00, buys: 0, sells: 0 },
            { symbol: 'WAL', name: 'Walkman Audio', price: 35.00, buys: 0, sells: 0 },
            { symbol: 'Y2K', name: 'Y2K CyberSec', price: 80.00, buys: 0, sells: 0 }
        ];

        function setAction(action) {
            currentAction = action;
            document.getElementById('btn-buy').className = action === 'BUY' ? 'bg-green-600 text-black font-bold p-2 text-center border-2 border-green-400' : 'bg-gray-700 text-green-400 font-bold p-2 text-center border-2 border-gray-600';
            document.getElementById('btn-sell').className = action === 'SELL' ? 'bg-red-600 text-black font-bold p-2 text-center border-2 border-red-400' : 'bg-gray-700 text-green-400 font-bold p-2 text-center border-2 border-gray-600';
        }

        function renderStocks() {
            const container = document.getElementById('stocks-container');
            const select = document.getElementById('stock-select');
            
            container.innerHTML = '';
            select.innerHTML = '';

            stocks.forEach(stock => {
                // Populate selector
                select.innerHTML += `<option value="${stock.symbol}">${stock.name} (${stock.symbol}) - $${stock.price.toFixed(2)}</option>`;

                // Populate live view
                container.innerHTML += `
                    <div class="flex justify-between items-center p-3 bg-black border border-green-800 rounded">
                        <div>
                            <p class="font-bold text-lg">${stock.name}</p>
                            <p class="text-xs text-gray-500">${stock.symbol}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-2xl font-bold">$${stock.price.toFixed(2)}</p>
                        </div>
                    </div>
                `;
            });
        }

        // Demand Algorithm Calculation
        function recalculatePrice(stock, qty, action) {
            const k = 0.02; // Sensitivity multiplier
            const netDemand = action === 'BUY' ? qty : -qty;
            const delta = stock.price * (k * (netDemand / 100));
            stock.price = Math.max(1.00, stock.price + delta);
        }

        // Order Execution
        document.getElementById('order-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const traderId = document.getElementById('trader-id').value;
            const symbol = document.getElementById('stock-select').value;
            const qty = parseInt(document.getElementById('trade-qty').value);
            
            const stock = stocks.find(s => s.symbol === symbol);
            recalculatePrice(stock, qty, currentAction);

            // Log ledger
            const ledger = document.getElementById('ledger');
            if (ledger.querySelector('p')) ledger.innerHTML = '';
            
            const entry = document.createElement('div');
            entry.className = `p-1 ${currentAction === 'BUY' ? 'text-green-400' : 'text-red-400'}`;
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${traderId} ${currentAction} ${qty}x ${symbol} @ $${stock.price.toFixed(2)}`;
            ledger.prepend(entry);

            renderStocks();
        });

        function triggerShock(symbol, shockPercent) {
            const stock = stocks.find(s => s.symbol === symbol);
            stock.price = Math.max(1.00, stock.price * (1 + shockPercent));
            renderStocks();
        }

        // Initial setup
        renderStocks();
    </script>
</body>
</html>
